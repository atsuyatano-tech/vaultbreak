<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAULTBREAK — a tiny bank heist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1020; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 160vh); height: auto; aspect-ratio: 8 / 5; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="VAULTBREAK: sneak through the lobby, gallery and vault room, grab the loot, crack the vault and escape to the van before the alarm reaches 100 percent"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
